services:
  db:
    # pgvector image: Postgres 16 with the vector extension already installed.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: claims
      POSTGRES_PASSWORD: claims
      POSTGRES_DB: claims
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claims"]
      interval: 2s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    # Migrations first (creates the vector extension, tables and indexes), then the API.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://claims:claims@db:5432/claims
      # stub = offline fake embeddings (lexical only). ollama = real embeddings.
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-stub}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      LLM_PROVIDER: ${LLM_PROVIDER:-stub}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      # Ollama runs on your Mac, outside Docker.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      # Set this to use a real LLM instead of the offline stub; leave unset
      # and the app falls back to deterministic local behavior.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
